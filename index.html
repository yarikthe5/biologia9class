[5,"Ген","Ділянка ДНК (у деяких вірусів — РНК) з інформацією про білок або РНК; одиниця спадковості"],
[5,"Генетичний код","Запис інформації послідовністю нуклеотидів, що визначає послідовність амінокислот у білках"]
];
const E=["🧬","🔗","🔬","🧵","🧶","📜"];
const LV=[[0,"Нуклеотид 🧫"],[200,"Ланцюг 🔗"],[600,"Спіраль 🧬"],[1200,"Суперспіраль 🧶"],[2000,"Хромосома 🔬"],[3000,"Геном 👑"]];
const CH=["Так! 🔥","Красава! 💪","Як справжній біолог!","Бездоганно ✨","Мозок працює 🧠","Легко!"],OOPS=["Ой, буває 🙈","Майже! Запам’ятай ↓","Ще раз — і буде 💪","Не біда, це вчиться ↓"];
const rnd=a=>a[Math.random()*a.length|0];
const lvl=()=>{const x=(st&&st.xp)||0;let l=0;LV.forEach((v,i)=>{if(x>=v[0])l=i});return l};
function pop(t){try{const d=document.createElement("div");d.className="pop";d.textContent=t;d.style.left=(35+Math.random()*30)+"%";d.style.top=(30+Math.random()*12)+"%";document.body.appendChild(d);setTimeout(()=>d.remove(),900)}catch(e){}}
function confetti(n){for(let i=0;i<(n||24);i++){try{const d=document.createElement("span");d.className="cf";d.textContent=rnd(["🎉","✨","⭐","🧬","🏆","🎊"]);d.style.left=Math.random()*100+"vw";d.style.animationDuration=(1.2+Math.random()*1.5)+"s";d.style.fontSize=(16+Math.random()*18)+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}catch(e){}}}
let AC=null;
function snd(f,t){if(st&&st.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(t||.12))}catch(e){}}
const sndOk=()=>{snd(660);setTimeout(()=>snd(880),90);try{navigator.vibrate(20)}catch(e){}},sndNo=()=>{snd(220,.25);try{navigator.vibrate([40,30,40])}catch(e){}};
function gain(n){const t=iso(new Date());if(st.last!=t){const y=new Date();y.setDate(y.getDate()-1);st.days=st.last==iso(y)?(st.days||0)+1:1;st.last=t}
 const b=lvl();st.xp=(st.xp||0)+n;pop("+"+n+" XP");if(lvl()>b){confetti(45);setTimeout(()=>pop("Новий ранг: "+LV[lvl()][1]),600)}}
function mute(){if(!st)st={ph:"start",read:[],rv:{}};st.mute=!st.mute;save();draw()}
const K="bio9_dnk_v1",$=document.getElementById("app"),N=S.length;
let st=null,cur=null;
try{st=JSON.parse(localStorage.getItem(K))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const all=()=>Q.map((_,i)=>i),ALLC=()=>C.map((_,i)=>i),cc=s=>ALLC().filter(i=>C[i][0]==s);
const iso=d=>d.toISOString().slice(0,10),IV=[0,1,3,7,14];
const due=()=>st&&st.rv?Object.keys(st.rv).filter(i=>st.rv[i].d<=iso(new Date())).map(Number):[];
function grade(i,ok){const r=st.rv[i]||{b:0};r.b=ok?Math.min(r.b+1,4):0;const d=new Date();d.setDate(d.getDate()+IV[r.b]);r.d=iso(d);st.rv[i]=r}
function fresh(){st={ph:"learn",sq:[...Array(N).keys()],si:0,cq:[],n:1,rm:"",sm:[],miss:[],pend:all(),qi:0,wrong:[],unk:all(),seen:[],read:[],round:0,rv:(st&&st.rv)||{},xp:(st&&st.xp)||0,days:(st&&st.days)||0,last:st&&st.last,mute:st&&st.mute,cb:0,hit:0};save();draw()}
function hdr(label,p){
 const dots=S.map((_,i)=>{let c="";if(st.read.includes(i)){c="r";const ids=Q.map((x,n)=>x[0]==i?n:-1).filter(n=>n>=0);
  if(ids.some(n=>st.unk.includes(n)&&st.seen.includes(n)))c="w";else if(ids.every(n=>st.seen.includes(n)))c="g"}return `<b class="${c}" title="${S[i][0]}"></b>`}).join("");
 return `<div class="top"><div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div><div class="meta"><span>${label}</span><a onclick="menu()" style="color:var(--a);cursor:pointer">☰ меню</a></div><div class="meta"><span>⭐ ${st.xp||0} · ${LV[lvl()][1]}</span><span>${st.cb>1?"🔥 x"+st.cb+" · ":""}📅 ${st.days||0} дн.</span></div><div class="dots">${dots}</div></div>`}
const LB={sec:"Згадай",mix:"Мікс-повторення",final:"Слабкі картки",daily:"Повторення на сьогодні",only:"Усі картки"};
function draw(){
 if(!st||st.ph=="start"){const d=due().length,p=st&&st.prev;
  $.innerHTML=`<div class="card c"><div class="big">🧬</div><h1>Біологія 9 кл. · §9 · ДНК</h1><p><span class="rank">${LV[lvl()][1]}</span><span class="rank">⭐ ${(st&&st.xp)||0} XP</span><span class="rank">🔥 ${(st&&st.days)||0} дн. підряд</span></p><p class="sm">Збирай XP, тримай серію 🔥, перемагай боса в тесті й дорости до <b>Генома 👑</b></p><p style="text-align:left">1) Читаєш ОДНУ тему (💡 + факти)<br>2) Одразу <b>згадуєш</b> її на картках: не знаєш — картка повертається<br>3) Після кожних 3 тем — мікс-повторення<br>4) Слабкі картки → тест → помилки по колу<br>5) Завтра й далі: «Повторення на сьогодні» — картки приходять самі, коли їх час</p>
  ${p?`<button class="btn" onclick="st.ph=st.prev;draw()">Продовжити</button>`:""}<button class="btn ${p?"s":""}" onclick="fresh()">${p?"Почати спочатку":"Почати"}</button>${d?`<button class="btn" onclick="daily()">Повторення на сьогодні (${d})</button>`:""}<button class="btn s" onclick="cardsOnly()">Усі картки підряд</button><button class="btn s" onclick="mute()">${st&&st.mute?"🔇 Звук вимкнено":"🔊 Звук увімкнено"}</button></div>`;if(!st)st={ph:"start",read:[],rv:{}};return}
 if(st.ph=="learn"){const i=st.sq[st.si],s=S[i];
  $.innerHTML=hdr(`${st.round?"Перечитування":"Читаємо"} · тема ${st.si+1} з ${st.sq.length}`,st.si/st.sq.length*100)+`<div class="card"><div class="tag">${E[i]} ${s[0]}</div><h2>${s[1]}</h2><div class="fb">💡 <b>Головне:</b> ${M[i]}</div><br><ul>${s[2].map(x=>`<li>${x}</li>`).join("")}</ul></div><p class="sm c">Прочитай один раз уважно. Далі — картки: ти згадуватимеш сам.</p><button class="btn" onclick="readDone()">Прочитав → перевіряю себе</button>`;scrollTo(0,0);return}
 if(st.ph=="recall"){if(!st.cq.length){recallEnd();return}const c=C[st.cq[0]];
  $.innerHTML=hdr(`${LB[st.rm]}: лишилось ${st.cq.length}`,(1-st.cq.length/st.n)*100)+`<div class="card c"><div class="tag">${E[c[0]]} ${S[c[0]][0]}</div><p class="sm">Скажи відповідь вголос чи подумки — і тоді відкривай</p><h2>${c[1]}</h2><div id="bk" class="fb" style="display:none"><b>${c[2]}</b></div></div><div id="bt"><button class="btn" onclick="flip()">Показати відповідь</button></div>`;scrollTo(0,0);return}
 if(st.ph=="quiz"){const n=st.pend[st.qi],q=Q[n];cur={n,o:sh(q.slice(2)),done:false};
  const hp=Math.round((1-(st.hit||0)/st.pend.length)*100);
  $.innerHTML=hdr(`Тест: ${st.qi+1} з ${st.pend.length}${st.round?" (повтор помилок)":""}`,st.qi/st.pend.length*100)+`<div class="sm">👹 Бос-файт: Незнання — ${hp}% здоров’я</div><div class="bar boss"><i style="width:${hp}%"></i></div><div class="card"><div class="tag">${E[q[0]]} ${S[q[0]][0]}</div><h2>${q[1]}</h2><div id="o">${cur.o.map((t,k)=>`<button class="opt" onclick="ans(${k})">${t}</button>`).join("")}</div><div id="fb"></div></div>`;scrollTo(0,0);return}
 if(st.ph=="res"){const w=[...new Set(st.wrong.map(n=>Q[n][0]))];
  $.innerHTML=hdr("Результат раунду",100)+`<div class="card c"><div class="big">🔁</div><h2>Помилок: ${st.wrong.length} з ${st.pend.length}</h2><p>Треба довчити:</p><p>${w.map(i=>`<b>${S[i][0]}</b> ${S[i][1]}`).join("<br>")}</p></div><button class="btn" onclick="relearn()">Перечитати й згадати ці теми</button>`;return}
 if(st.ph=="done"){$.innerHTML=hdr("Готово!",100)+`<div class="card c"><div class="big">🏆</div><h1>Усе засвоєно!</h1><p>Усі ${Q.length} питань правильно. Раундів повторення: ${st.round}.</p><p class="sm">Щоб воно не вивітрилось — завтра і післязавтра відкрий «Повторення на сьогодні» (5 хвилин).</p></div><button class="btn" onclick="menu()">☰ До меню</button><button class="btn s" onclick="fresh()">Пройти все з нуля</button>`}}
function flip(){document.getElementById("bk").style.display="block";document.getElementById("bt").innerHTML='<button class="btn" onclick="kn(1)">Знав ✓</button><button class="btn s" onclick="kn(0)">Не знав — ще раз ↻</button>'}
function kn(y){const i=st.cq.shift();
 if(y){st.cb=(st.cb||0)+1;gain(8+Math.min(st.cb,5)*2);sndOk();if(!st.sm.includes(i))grade(i,true);st.miss=st.miss.filter(x=>x!=i)}
 else{st.cb=0;sndNo();if(!st.sm.includes(i)){st.sm.push(i);grade(i,false)}if(!st.miss.includes(i))st.miss.push(i);st.cq.splice(Math.min(3,st.cq.length),0,i)}
 save();draw()}
function rc(l,m){st.cq=sh(l);st.n=l.length||1;st.rm=m;st.sm=[];st.ph="recall";save();draw()}
function recallEnd(){const m=st.rm;
 if(m=="sec"){gain(30);confetti(18);setTimeout(()=>pop("Тема засвоєна 🎉"),500);const k=st.si+1;if(!st.round&&k%3==0)return rc(st.sq.slice(k-3,k).flatMap(cc),"mix");return adv()}
 if(m=="mix"){gain(40);return adv()}
 if(m=="final"){gain(60);return toQuiz()}
 st.ph="start";save();draw()}
function adv(){st.si++;if(st.si>=st.sq.length){if(!st.round&&st.miss.length)return rc(st.miss.slice(),"final");return toQuiz()}st.ph="learn";save();draw()}
function toQuiz(){st.hit=0;st.ph="quiz";st.qi=0;st.wrong=[];st.pend=sh(st.pend);save();draw()}
function readDone(){const i=st.sq[st.si];if(!st.read.includes(i))st.read.push(i);rc(cc(i),"sec")}
function daily(){const l=due();if(!l.length)return;if(st.prev=="recall")st.prev="learn";rc(l,"daily")}
function cardsOnly(){if(!st||!st.pend){fresh();st.prev="learn"}if(st.prev=="recall")st.prev="learn";rc(ALLC(),"only")}
function menu(){st.prev=st.ph;st.ph="start";save();draw()}
function ans(k){if(cur.done)return;cur.done=true;const q=Q[cur.n],ok=cur.o[k]==q[2];
 [...document.querySelectorAll(".opt")].forEach((b,j)=>{if(cur.o[j]==q[2])b.classList.add("ok");else if(j==k)b.classList.add("no");b.style.pointerEvents="none"});
 if(!st.seen.includes(cur.n))st.seen.push(cur.n);
 if(ok){st.unk=st.unk.filter(x=>x!=cur.n);st.hit=(st.hit||0)+1;st.cb=(st.cb||0)+1;gain(10+Math.min(st.cb,5)*3);sndOk()}else{st.wrong.push(cur.n);st.cb=0;sndNo();const cd=document.querySelector(".card");if(cd)cd.classList.add("shake")}
 document.getElementById("fb").innerHTML=`<div class="fb">${ok?"✅ "+rnd(CH)+(st.cb>2?" Серія x"+st.cb+"!":""):`❌ ${rnd(OOPS)}<br>Правильна відповідь: <b>${q[2]}</b><br><span class="sm">Повтори: ${S[q[0]][0]} ${S[q[0]][1]}</span>`}</div><button class="btn" onclick="next()">Далі →</button>`;save()}
function next(){st.qi++;if(st.qi>=st.pend.length){st.ph=st.wrong.length?"res":"done";if(!st.wrong.length){gain(100);confetti(80)}}save();draw()}
function relearn(){st.sq=[...new Set(st.wrong.map(n=>Q[n][0]))].sort((a,b)=>a-b);st.si=0;st.pend=st.wrong.slice();st.wrong=[];st.round++;st.hit=0;st.ph="learn";save();draw()}
if(st&&!st.ph)st=null;draw();
</script></body></html>
