const S=[
["§7.1","Білки й амінокислоти",["<b>Білки</b> — високомолекулярні біополімери; мономери — <b>залишки амінокислот</b>. У клітинах тварин до 40–50 % сухої маси, у рослинних — 20–35 %","<b>Амінокислота</b>: <b>аміногрупа</b> (–NH₂, лужна), <b>карбоксильна група</b> (–СООН, кисла), атом Н і <b>радикал (R-група)</b> — він визначає хімічну унікальність","Відомо понад 600 амінокислот, але в білках зазвичай <b>20 стандартних (протеїногенних)</b>; вони кодуються генетичним кодом","<b>Замінні</b> — синтезуються в організмі людини й тварин; <b>незамінні</b> — ні, надходять з їжею (їх синтезують рослини, гриби, бактерії)","<b>Незамінні</b>: лізин, лейцин, ізолейцин, треонін, триптофан, фенілаланін, валін, метіонін (дітям ще аргінін і гістидин). <b>Повноцінні білки</b> містять усі незамінні","Попередники: <b>тирозин</b> → тироксин, адреналін; <b>триптофан</b> → серотонін; <b>фенілаланін</b> → дофамін"]],
["§7.2","Пептидний зв’язок і поліпептиди",["Залишки амінокислот з’єднані <b>пептидними зв’язками</b> — міцними ковалентними між –СООН однієї амінокислоти й –NH₂ іншої; при цьому виділяється <b>вода</b>","<b>Дипептид</b> — з двох амінокислот; <b>поліпептид</b> — з багатьох (від 6–10 до кількох десятків залишків)","<b>Білки</b> — поліпептиди з великою молекулярною масою (від 6000 до кількох мільйонів); один або кілька поліпептидних ланцюгів, до кількох тисяч залишків","Різні комбінації амінокислот дають мільйони типів білків (у людини понад 5 млн)","Одні білки складаються лише з амінокислот, інші мають <b>небілкові компоненти</b> (залишки Н₃РО₄, нуклеїнових кислот, вуглеводів, ліпідів, атоми Fe, Zn, Cu)"]],
["§7.3","Рівні структури білків",["<b>Конформація</b> — просторове розташування атомів у молекулі. Є <b>4 рівні</b> структури","<b>Первинна</b> — послідовність амінокислотних залишків (<b>пептидні</b> зв’язки); вона зумовлює властивості й функції білка","<b>Вторинна</b> — спіраль (α-спіраль) завдяки <b>водневим зв’язкам</b> між атомами Н і О пептидних груп різних витків; або зближені ділянки-ланцюги","<b>Третинна</b> — <b>глобула</b> (грудка). Тримають: <b>дисульфідні</b> зв’язки між залишками <b>цистеїну</b> (ковалентні), гідрофобні, електростатичні (йонні) взаємодії, водневі зв’язки","<b>Гідрофобні</b> залишки йдуть всередину молекули, <b>гідрофільні</b> — назовні (до води). Третинна може бути глобулярна або <b>фібрилярна</b> (ниткоподібна)","<b>Четвертинна</b> — об’єднання кількох глобул. Приклад: <b>гемоглобін</b> — 4 поліпептидні ланцюги","<b>AlphaFold2</b> (Google DeepMind) передбачає структуру білків; Гассабіс і Джампер — Нобелівська премія з хімії 2024"]],
["§7.4","Властивості білків: денатурація",["<b>Фібрилярні</b> — зазвичай нерозчинні у воді; структурна (кератин волосся) або рухова (скоротливі білки) функції","<b>Глобулярні</b> — здебільшого водорозчинні: гемоглобін (транспорт газів), пепсин (розщеплення білків), імуноглобуліни (захист)","<b>Денатурація</b> — втрата природної просторової структури (розгортання) <b>без зміни первинної</b> під дією температури, кислот, лугів тощо","Здебільшого необоротна. На початкових стадіях можлива <b>ренатурація</b> — відновлення структури після припинення дії чинника","В організмі оборотна денатурація пов’язана з рухами, передаванням сигналів, прискоренням реакцій","<b>Деструкція</b> — руйнування <b>первинної</b> структури (пептидних зв’язків); необоротна"]],
["§10.1","РНК та її типи",["<b>РНК</b> — <b>один ланцюг</b> (ДНК — два). Нуклеотиди: аденіловий, гуаніловий, цитидиловий, уридиловий → основи <b>А, Г, Ц, У</b>. Структури (вторинна, третинна) стабілізують йони металів, напр. Mg²⁺","<b>мРНК</b> — копія ділянки ДНК (транскрипція); переносить інформацію про послідовність амінокислот до <b>рибосоми</b>; від сотень до тисяч нуклеотидів","<b>тРНК</b> — найменша (73–93 нуклеотиди); кожна приєднує <b>одну</b> амінокислоту й несе її до рибосоми","Вторинна структура тРНК — «<b>листок конюшини</b>» (водневі зв’язки між комплементарними нуклеотидами); третинна — як літера <b>Г</b>","<b>Антикодон</b> — триплет біля верхівки тРНК; взаємодіє з комплементарним триплетом мРНК — <b>кодоном</b>. Амінокислота приєднана ковалентно біля основи","<b>рРНК</b> — у складі <b>рибосом</b>, їхній каркас; з білками забезпечує розташування мРНК і тРНК. тРНК та рРНК інформації про білок не несуть","<b>мікроРНК</b> (21–22 нуклеотиди) зв’язуються з комплементарними ділянками мРНК і регулюють активність генів (Фаєр і Мелло, Нобелівська премія 2006). РНК-вакцини — проти COVID-19"]],
["§10.2","АТФ — енергетична валюта клітини",["<b>АТФ (аденозинтрифосфатна кислота)</b> — нуклеотид: <b>аденін + рибоза + три залишки</b> ортофосфатної кислоти (у нуклеотидах НК — один)","Між залишками Н₃РО₄ — <b>два макроергічні зв’язки</b> (високоенергетичні)","АТФ → <b>АДФ</b> + Р: вивільняється ≈ <b>40 кДж/моль</b>; АТФ → <b>АМФ</b> (відщеплено два залишки): ≈ <b>80 кДж/моль</b>. Реакцію прискорює фермент","Зворотні реакції (приєднання Н₃РО₄) <b>накопичують енергію</b>: АМФ → АДФ → АТФ, по ≈ 40 кДж на кожен залишок","Енергія АТФ іде на синтез білків, жирів, вуглеводів, температуру тіла, м’язове скорочення, активний транспорт","Інші функції АТФ: синтез нуклеїнових кислот, регуляція ферментів, <b>нейромедіатор</b>. ГТФ, ЦТФ, УТФ, ТТФ — матеріал для ланцюгів ДНК і РНК; універсальне джерело енергії — саме АТФ"]]
